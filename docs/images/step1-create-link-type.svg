<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#f4f7fb"/>
  <text x="60" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2d3d">Step 1: Create a Profit Link Type</text>
  <rect x="60" y="110" width="1080" height="450" rx="16" fill="#ffffff" stroke="#d2ddea"/>

  <rect x="110" y="180" width="300" height="140" rx="12" fill="#e8f1ff" stroke="#6d9ee8"/>
  <text x="140" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#1c4587">Source company</text>
  <text x="140" y="270" font-family="Consolas, monospace" font-size="22" fill="#1c4587">api::bedrijf.bedrijf</text>

  <rect x="450" y="175" width="300" height="150" rx="12" fill="#fff2cc" stroke="#d6b656"/>
  <text x="495" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#7f6000">Link type</text>
  <text x="485" y="265" font-family="Consolas, monospace" font-size="20" fill="#7f6000">bedrijf_winst_ontvanger</text>

  <rect x="790" y="180" width="300" height="140" rx="12" fill="#e8f1ff" stroke="#6d9ee8"/>
  <text x="820" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#1c4587">Target company</text>
  <text x="820" y="270" font-family="Consolas, monospace" font-size="22" fill="#1c4587">api::bedrijf.bedrijf</text>

  <path d="M 410 250 L 450 250" stroke="#4a86e8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 750 250 L 790 250" stroke="#4a86e8" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="110" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#1f2d3d">Table created automatically:</text>
  <rect x="110" y="415" width="980" height="110" rx="10" fill="#f9fafc" stroke="#d2ddea"/>
  <text x="140" y="465" font-family="Consolas, monospace" font-size="24" fill="#0b5394">temporal_links_bedrijf_winst_ontvanger</text>
  <text x="140" y="500" font-family="Consolas, monospace" font-size="20" fill="#3d3d3d">Columns include: bedrijf_id, bedrijf_id (target side), start_date, end_date, metadata</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a86e8"/>
    </marker>
  </defs>
</svg>
